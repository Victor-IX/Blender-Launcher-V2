    No se pudo guardar el token de GitHub en el llavero seguro del sistema.

    El token se ha guardado en tu archivo de configuración.
    Esto es menos seguro que guardarlo en el llavero.

    Plantéate instalar la compatibilidad con llaveros en tu sistema.

