  bash_arguments_tooltip: |
    Instrucciones que se pasarán a bash al lanzar Blender (antes del ejecutable de Blender, es decir, [<args> …])
    PREDETERMINADO: Ninguno
    Ejemplo: env __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia nohup
  bash_arguments: "Argumentos de Bash:"
  use_nohup: "Registrar la salida de Bash con nohup"
  use_nohup_tooltip: |
    Antepone el comando "nohup" a tus argumentos de Bash
    PREDETERMINADO: Desactivado
    Ejemplo: si tu cadena de argumentos de Bash es "konsole --hold --separate -e" y esta opción está activada, el comando se lanzará como "nohup konsole --hold --separate -e". Ten en cuenta que nohup guarda toda la salida en nohup.out, que normalmente se encuentra en el directorio principal de ${HOME} (~/nohup.out). Cada vez que se ejecuta nohup, el archivo no se sobrescribe, sino que se le añade la salida de bash de cada instancia de nohup, así que vigila el tamaño del archivo.
  startup_arguments: "Argumentos de inicio:"

