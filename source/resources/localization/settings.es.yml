

general:
  label: General
  app:
    label: Aplicación
    library_folder: "Carpeta de la biblioteca:"

    language: Idioma
    language_auto: Automático
    language_tooltip: |
      Selecciona el idioma de la interfaz de Blender Launcher.
      "Automático" detecta el idioma del sistema.
      Es necesario reiniciar para aplicar el cambio.
      PREDETERMINADO: Automático

    system_start: Iniciar con el sistema
    system_start_tooltip: |
      Inicia la aplicación al arrancar el sistema.
      PREDETERMINADO: Desactivado
    launch_minimized: Iniciar minimizado en la bandeja
    launch_minimized_tooltip: |
      Inicia la aplicación minimizada en la bandeja del sistema.
      PREDETERMINADO: Desactivado
    minimize: Minimizar a la bandeja
    minimize_tooltip: |
      Al cerrar la aplicación, se minimizará en la bandeja del sistema en lugar de cerrarse por completo
      PREDETERMINADO: Desactivado
    worker_count: Número de hilos de trabajo
    worker_count_tooltip: |
      Determina cuántas operaciones de E/S pueden hacerse a la vez, p. ej., descargar, eliminar o extraer
      PREDETERMINADO: <núm. de CPU> * (3/4)
    worker_count_warning: "(Advertencia: ¡valor superior a %{cnt} (núm. de CPU)!)"
    prerelease: Usar versiones preliminares
    prerelease_tooltip: |
      Al buscar una nueva versión de Blender Launcher, incluye también las versiones preliminares.
      ADVERTENCIA: ¡Es probable que estas versiones tengan errores! Se usan principalmente para probar nuevas funciones.
      PREDETERMINADO: Desactivado

    create_shortcut: Crear %{shortcut_type} de Blender Launcher
    shortcut_type:
      windows: acceso directo
      linux: archivo .desktop
      macos: acceso directo
  migratel2u: Migrar la configuración local a la configuración de usuario

  file_assoc:
    label: Asociación de archivos

    register: Registrar asociación de archivos
    register_tooltip: |
      Añade Blender Launcher a la lista de programas que pueden abrir archivos .blend

    unregister: Anular asociación de archivos
    unregister_tooltip: |
      Quita Blender Launcher de la lista de programas que pueden abrir archivos .blend

    launch_timer_duration: Duración del temporizador de lanzamiento (s)
    launch_timer_duration_tooltip: |
      Determina cuánto tiempo tienes, al abrir archivos .blend, para cambiar la versión que se va a lanzar
      PREDETERMINADO: 3 s
    launch_timer_suffix:
      "-1": " (Desactivado)"
      "0": "s (Inmediato)"
      more: "s"

  winget:
    label: Integración con WinGet

    info: Registra Blender Launcher en el gestor de paquetes WinGet para activar las actualizaciones automáticas mediante 'winget update'.
    register: Registrar en WinGet
    register_tooltip: |
      Registra esta instalación en WinGet para poder actualizarla mediante 'winget update'
    unregister: Anular registro en WinGet
    unregister_tooltip: |
      Elimina el registro de esta instalación en WinGet

  advanced:
    label: Avanzado

    delete_actions:
      "0": Enviar a la papelera
      "1": Eliminar permanentemente
    default_delete_action: Acción de eliminación predeterminada
    default_delete_action_tooltip: |
      Establece la acción disponible en el menú contextual para eliminar una versión
      La otra opción está disponible manteniendo pulsada la tecla Shift
      PREDETERMINADO: Enviar a la papelera

    purge_temp: Vaciar carpeta temporal al iniciar
    purge_temp_tooltip: |
      Vacía automáticamente la carpeta temporal de descargas al iniciar Blender Launcher.
      PREDETERMINADO: Activado

    purge_temp_now: Vaciar carpeta temporal ahora
    purge_temp_now_tooltip: |
        Elimina inmediatamente todos los archivos de la carpeta temporal de descargas

  logging:
    label: Registro
    log_level: Nivel de registro
    log_level_tooltip: |
      Nivel de detalle de los mensajes que se escriben en blender-launcher.log.
      Los niveles más bajos incluyen más detalle (DEBUG es el más detallado).
      Es necesario reiniciar para aplicar el cambio.
      PREDETERMINADO: INFO
    open_log_folder: Abrir carpeta de registros
    open_log_folder_tooltip: |
      Abre la carpeta que contiene blender-launcher.log en el gestor de archivos del sistema.



