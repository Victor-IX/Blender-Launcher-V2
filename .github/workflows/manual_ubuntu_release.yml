name: Manual Ubuntu Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          echo "Installing dependencies from uv.lock"
          uv sync --locked
          source ./.venv/bin/activate
          echo "Building style"
          python build_style.py
          echo "Building Linux"
          cd ./scripts/
          sh ./build_linux.sh
      - name: Get Latest Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
      - name: Zipping
        run: |
          echo "Zipping to Blender_Launcher_${{ env.LATEST_TAG }}_Ubuntu_x64.zip"
          cd ./dist/release/
          zip Blender_Launcher_${{ env.LATEST_TAG }}_Ubuntu_x64.zip "./Blender Launcher"
      - name: Upload to Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.LATEST_TAG }}" ./dist/release/Blender_Launcher_"${{ env.LATEST_TAG }}"_Ubuntu_x64.zip
